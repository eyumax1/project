<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="index.php" method="post">
      <label for="username"> username</label>
      <input
        type="text"
        id="username"
        minlength="4"
        placeholder="enter username"
      />
      <br />

      <label for="password"> password</label>
      <input type="password" id="password" placeholder="enter password" />
      <br />

      <lable for="email">email</lable>
      <input type="email" id="email" placeholder="someone@gmail.com" /> <br />

      <lable for="phone">phone number</lable>
      <input
        type="tel"
        id="phone"
        placeholder="123-456-7890"
        pattern=" [0-9]{3}-[0-9]{3}-[0-9]{4}"
      />
      <br />

      <label for="bday">birthday</label>
      <input type="date" id="bday" /><br />

      <label for="title">title</label>

      <label for="mr">mr</label>
      <input type="radio" id="mr" value="mr" name="title" />

      <label for="ms">ms</label>
      <input type="radio" id="ms" value="ms" name="title" />

      <label for="phd">phd</label>
      <input type="radio" id="phd" value="phd" name="title" /><br />

      <label for="pay">payment</label>
      <select id="pay">
        <option value="visa">visa</option>
        <option value="paypal">paypal</option></select
      ><br />
      <label for="comment">comment</label>
      <textarea id="comment" rows="3"cols="10"></textarea><br>

      <input type="submit" />
    </form>
  </body>
</html>
